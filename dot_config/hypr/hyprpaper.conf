# The wallpaper is chosen by hypr-daynight-wallpaper: one image for daylight,
# and hourly frames from 20:00 to midnight that tell a small story as the night
# goes on. Driven by the hypr-daynight-wallpaper.timer user unit; the entry
# below is only the starting image, corrected a moment after login.
ipc = on
splash = false

preload = ~/.config/hypr/wallpapers/macchiato-day.jpg
wallpaper = , ~/.config/hypr/wallpapers/macchiato-day.jpg
