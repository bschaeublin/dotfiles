# Wallpapers are switched at local sunrise/sunset by hypr-daynight-wallpaper,
# which is driven by the hypr-daynight-wallpaper.timer user unit. The entry
# below is only the starting image; the script corrects it a moment after login.
ipc = on
splash = false

preload = ~/.config/hypr/wallpapers/macchiato-day.png
wallpaper = , ~/.config/hypr/wallpapers/macchiato-day.png
